# Nookline — README.md has full setup.
#
# Apps only (no Kokoro GPU): docker compose up -d --build
# + Kokoro (NVIDIA GPU):     docker compose --profile kokoro up -d --build

services:
  kokoro-nookline:
    profiles:
      - kokoro
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    container_name: kokoro-nookline
    restart: unless-stopped
    gpus:
      - driver: nvidia
        count: all
        capabilities: [gpu]
    ports:
      - "8882:8880"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_LOG_LEVEL: WARNING
      USE_GPU: "true"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
      NUMEXPR_NUM_THREADS: 4
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          memory: 1G
    networks:
      - nookline

  backend:
    build: ./backend
    container_name: nookline-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4005}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: file:/data/app.db
      UPLOAD_DIR: /books
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — copy from .env.example}
      KOKORO_TTS_URL: ${KOKORO_TTS_URL:-http://kokoro-nookline:8880}
    volumes:
      - nookline-data:/data
      - ${BOOKS_BIND:-./books}:/books
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - nookline

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3009}:3009"
    networks:
      - nookline

volumes:
  nookline-data:

networks:
  nookline:
    driver: bridge
