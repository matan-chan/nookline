# Forward the whole /api/ prefix to the backend (GraphQL, /api/files/*, /api/tts/*).
# If your edge proxy only routes /api/graphql, PDF/EPUB requests stay on the SPA and return HTML — react-pdf shows "Failed to load PDF file."
server {
  listen 3009;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    client_max_body_size 500m;
    proxy_pass http://nookline-backend:4000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ~* ^/assets/.+\.mjs$ {
    root /usr/share/nginx/html;
    default_type application/javascript;
  }

  location ~* ^/(sw\.js|workbox-[a-f0-9]+\.js|manifest\.webmanifest)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
