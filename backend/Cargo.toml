[package]
name = "nookline-backend"
version = "0.1.11"
edition = "2021"

[lib]
name = "nookline_backend"
path = "src/lib.rs"

[[bin]]
name = "nookline-backend"
path = "src/main.rs"

[[bin]]
name = "nookline-perf"
path = "src/bin/nookline-perf.rs"

[dependencies]
async-graphql = "7.0"
async-graphql-axum = "7.0"
axum = { version = "0.8", features = ["json", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
mime_guess = "2"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
urlencoding = "2"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
zip = "2"
dashmap = "6"
once_cell = "1"

[dev-dependencies]
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }
regex = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"