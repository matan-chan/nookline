# Nookline — quick-start with pre-built images from GHCR.
#
# 1. Copy this file:
#      cp docker-compose.example.yml docker-compose.yml
#
# 2. Copy environment file (optional: set JWT_SECRET yourself, or omit it and
#    the backend image will generate one on first start and store it on the
#    nookline-data volume under /data/.jwt_secret):
#      cp .env.example .env
#
# 3. (Optional) Create the external network if you use Nginx Proxy Manager:
#      docker network create nginx-proxy-manager
#    Remove the nginx-proxy-manager sections below if you don't use NPM.
#
# 4. Start:
#      docker compose up -d
#
#    With GPU Kokoro TTS:
#      docker compose --profile kokoro up -d

services:
  kokoro-nookline:
    profiles:
      - kokoro
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    container_name: kokoro-nookline
    restart: unless-stopped
    gpus:
      - driver: nvidia
        count: all
        capabilities: [gpu]
    ports:
      - "8882:8880"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_LOG_LEVEL: WARNING
      USE_GPU: "true"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
      NUMEXPR_NUM_THREADS: 4
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          memory: 1G
    networks:
      - nookline
      - nginx-proxy-manager

  backend:
    image: ghcr.io/matan-chan/nookline-backend:latest
    container_name: nookline-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4005}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: file:/data/app.db
      UPLOAD_DIR: /books
      JWT_SECRET: ${JWT_SECRET:-}
      TTS_URL: ${TTS_URL:-${KOKORO_TTS_URL:-http://kokoro-nookline:8880}}
    volumes:
      - nookline-data:/data
      - ${BOOKS_BIND:-./books}:/books
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - nookline
      - nginx-proxy-manager

  frontend:
    image: ghcr.io/matan-chan/nookline-frontend:latest
    container_name: nookline-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3009}:3009"
    networks:
      - nookline
      - nginx-proxy-manager

volumes:
  nookline-data:

networks:
  nookline:
    driver: bridge
  nginx-proxy-manager:
    external: true
