# Nookline — quick-start with pre-built images from GHCR.
#
# 1. Copy this file:
#      cp docker-compose.example.yml docker-compose.yml
#
# 2. Copy environment file (optional: set JWT_SECRET yourself, or omit it and
#    the backend image will generate one on first start and store it on the
#    nookline-data volume under /data/.jwt_secret):
#      cp .env.example .env
#
# 3. (Optional) Create the external network if you use Nginx Proxy Manager:
#      docker network create nginx-proxy-manager
#    Remove the nginx-proxy-manager sections below if you don't use NPM.
#
# 4. Start shared Kokoro (apps/kokoro), then:
#      docker compose up -d
#
# Backend image is the Rust server (see docs/BACKEND_RUST_CUTOVER.md).

services:
  backend:
    image: ghcr.io/matan-chan/nookline-backend:latest
    container_name: nookline-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4005}:4000"
    # DATABASE_URL optional: defaults to sqlite file:/data/app.db (persisted on nookline-data volume).
    # Books/libraries live under /books inside the container; mount host path there only.
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-}
      TTS_URL: ${TTS_URL:-${KOKORO_TTS_URL:-http://kokoro:8880}}
    volumes:
      - nookline-data:/data
      - ${BOOKS_BIND:-./books}:/books
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - nookline
      - nginx-proxy-manager

  frontend:
    image: ghcr.io/matan-chan/nookline-frontend:latest
    container_name: nookline-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3009}:3009"
    networks:
      - nookline
      - nginx-proxy-manager

volumes:
  nookline-data:

networks:
  nookline:
    driver: bridge
  nginx-proxy-manager:
    external: true
